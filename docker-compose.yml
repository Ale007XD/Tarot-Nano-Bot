services:
  tarot-bot:
    build: .
    container_name: tarot-bot
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - BOT_TOKEN=${BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - LLM_MODEL=${LLM_MODEL}
      - TAROT_SALT=${TAROT_SALT}
    volumes:
      - ./tarot.db:/app/tarot.db
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
