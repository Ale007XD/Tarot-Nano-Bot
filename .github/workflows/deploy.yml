name: Deploy Tarot Bot

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy environment file
        run: |
          # Копируем .env из постоянного хранилища в рабочую директорию
          cp /home/botrunner/tarot-bot/.env ${{ github.workspace }}/.env
          
      - name: Build and Deploy
        run: |
          # Переходим в директорию репозитория
          cd ${{ github.workspace }}
          
          # Останавливаем старые контейнеры
          docker compose down
          
          # Собираем и запускаем заново
          docker compose up -d --build
          
          # Очищаем старые образы для экономии места
          docker image prune -f
