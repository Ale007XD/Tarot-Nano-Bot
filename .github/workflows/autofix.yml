name: Automated Code Style Autofix

on:
  push:
    branches: [main]
    paths:
      - '**.py'

jobs:
  ruff-autofix:
    name: Ruff Auto-repair Execution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Защитный сентинел: игнорируем триггер, если автором пуша является сам бот
    # или в сообщении коммита уже есть маркер [skip ci]
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Execute Auto-Fix
        # Исправление импортов, синтаксиса и приведение к современному Python
        run: ruff check --fix --select=E,F,I,UP .

      - name: Execute Formatting
        # Приведение к line-length=100 (поддерживается только для format)
        run: ruff format --line-length=100 .

      - name: Commit and Push Corrected Code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: автоматическое исправление ruff (E,F,I,UP) [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: '*.py'
