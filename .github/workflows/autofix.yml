name: Automated Code Style Autofix

on:
  push:
    branches: [main]
    paths:
      - '**.py'

jobs:
  ruff-autofix:
    name: Ruff Auto-repair Execution
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      # Fix imports, unused vars, upgrades — config from pyproject.toml
      - name: Fix lint issues
        run: ruff check --fix .

      # Format to line-length=100 — config from pyproject.toml
      - name: Format code
        run: ruff format .

      - name: Commit and Push Corrected Code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: ruff autofix [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: '*.py'
