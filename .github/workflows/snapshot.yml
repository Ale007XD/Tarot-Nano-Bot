name: LLM Snapshot Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tree jq

      ###########################################################
      # DIRECTORY TREE
      ###########################################################

      - name: Generate repository tree
        run: |
          tree \
            -a \
            -I '.git|node_modules|dist|build|coverage|__pycache__|*.log|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.pdf|*.zip' \
            --dirsfirst \
            > tree.txt

      ###########################################################
      # PREPARE SNAPSHOT STRUCTURE
      ###########################################################

      - name: Prepare snapshot directories
        run: |
          mkdir -p snapshot/chunks
          mkdir -p snapshot/meta

      ###########################################################
      # CREATE MANIFEST
      ###########################################################

      - name: Create manifest
        run: |
          cat > snapshot/manifest.json <<EOF
          {
            "snapshot_version": 1,
            "commit": "$(git rev-parse HEAD)",
            "branch": "$(git branch --show-current)",
            "created_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "files": []
          }
          EOF

      ###########################################################
      # BUILD CHUNKED FILE PROJECTIONS
      ###########################################################

      - name: Generate chunked projections
        shell: bash
        run: |
          git ls-files > files.txt

          chunk_index=0

          while IFS= read -r file; do

            if [ ! -f "$file" ]; then
              continue
            fi

            size=$(stat -c%s "$file" 2>/dev/null || echo 0)

            # Skip binaries and large files
            if [ "$size" -gt 300000 ]; then
              continue
            fi

            case "$file" in
              *.py|*.js|*.ts|*.tsx|*.jsx|*.json|*.md|*.txt|*.yaml|*.yml|*.sh|*.toml|*.ini)
                ;;
              *)
                continue
                ;;
            esac

            ext="${file##*.}"

            chunk_file=$(printf "snapshot/chunks/chunk_%05d.md" "$chunk_index")

            sha=$(sha256sum "$file" | awk '{print $1}')

            {
              echo "FILE: $file"
              echo "SIZE: $size"
              echo "SHA256: $sha"
              echo ""
              echo '```'"$ext"
              cat "$file"
              echo ""
              echo '```'
            } > "$chunk_file"

            jq \
              --arg path "$file" \
              --arg sha "$sha" \
              --arg chunk "$(basename "$chunk_file")" \
              --argjson size "$size" \
              '.files += [{
                path: $path,
                sha256: $sha,
                size: $size,
                chunk: $chunk
              }]' \
              snapshot/manifest.json \
              > snapshot/manifest.tmp

            mv snapshot/manifest.tmp snapshot/manifest.json

            chunk_index=$((chunk_index + 1))

          done < files.txt

      ###########################################################
      # GENERATE COMBINED MARKDOWN SNAPSHOT
      ###########################################################

      - name: Generate combined markdown snapshot
        run: |
          OUTPUT="snapshot/project-snapshot.md"

          {
            echo "# Project Snapshot"
            echo ""
            echo "## Commit"
            echo "$(git rev-parse HEAD)"
            echo ""
            echo "## Branch"
            echo "$(git branch --show-current)"
            echo ""
            echo "## Generated"
            echo "$(date -u)"
            echo ""
            echo "## Repository Tree"
            echo ""
            echo '```'
            cat tree.txt
            echo '```'
            echo ""

            for chunk in snapshot/chunks/*.md; do
              cat "$chunk"
              echo ""
              echo "---"
              echo ""
            done

          } > "$OUTPUT"

      ###########################################################
      # OPTIONAL SEMANTIC INDEX
      ###########################################################

      - name: Generate semantic index
        run: |
          cat > snapshot/meta/semantic-index.json <<EOF
          {
            "python_files": $(find . -name "*.py" | jq -R . | jq -s .),
            "markdown_files": $(find . -name "*.md" | jq -R . | jq -s .),
            "yaml_files": $(find . -name "*.yml" -o -name "*.yaml" | jq -R . | jq -s .)
          }
          EOF

      ###########################################################
      # ARCHIVE
      ###########################################################

      - name: Create archive
        run: |
          tar -czf snapshot.tar.gz snapshot

      ###########################################################
      # UPLOAD
      ###########################################################

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.sha }}
          path: |
            snapshot/
            snapshot.tar.gz
            tree.txt
          retention-days: 30
