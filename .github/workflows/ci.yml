name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Core & Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic>=2.0 aiosqlite aiogram>=3.0 pytest pytest-asyncio

      - name: Lint Verification (Ruff)
        # CI выполняет только проверку соответствия правилам E,F,I,UP
        run: ruff check --line-length=100 --select=E,F,I,UP .

      - name: Strict Type Check (Mypy)
        # Соответствие жесткому ограничению: mypy --strict 0 errors
        run: mypy --strict bot/

  test:
    name: Async Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram>=3.0 aiosqlite pydantic>=2.0 pytest pytest-asyncio

      - name: Execute Automated Tests
        # Запуск pytest-asyncio тестов в изолированном окружении
        run: pytest
        
