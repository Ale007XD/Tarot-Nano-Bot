name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic>=2.0 aiosqlite aiogram>=3.0 \
            pytest pytest-asyncio python-dotenv litellm llm-nano-vm

      - name: Lint (Ruff check)
        run: ruff check .

      - name: Format (Ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy --ignore-missing-imports --strict bot/

  test:
    name: Async Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram>=3.0 aiosqlite pydantic>=2.0 \
            pytest pytest-asyncio python-dotenv litellm llm-nano-vm

      - name: Run tests
        run: PYTHONPATH=. pytest -v
