name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Core & Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic>=2.0 aiosqlite aiogram>=3.0 pytest pytest-asyncio python-dotenv

      - name: Lint Verification (Ruff Check)
        run: ruff check .

      - name: Format Verification (Ruff Format)
        run: ruff format --check .

      - name: Strict Type Check (Mypy)
        run: mypy --strict bot/

  test:
    name: Async Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram>=3.0 aiosqlite pydantic>=2.0 pytest pytest-asyncio python-dotenv

      - name: Execute Automated Tests
        # Детерминированный запуск в строгом асинхронном режиме с фиксацией путей ядра
        run: PYTHONPATH=. pytest -v
